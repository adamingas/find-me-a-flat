[project]
name = "openrent-fetch"
version = "0.1.0"
description = "Import OpenRent rental listings and full-size photographs into SQLite."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22,<1",
    "beautifulsoup4>=4.13,<5",
    "click>=8.1,<9",
    "croniter>=6,<7",
    "dbos>=3.2,<4",
    "httpx>=0.28,<1",
    "openai-agents>=0.23.1,<1",
    "pillow>=11,<13",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "tenacity>=9,<10",
    "tzdata>=2026.5",
]

[project.scripts]
openrent = "openrent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrent"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "pre-commit>=4,<5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
