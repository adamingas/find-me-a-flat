default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: encrypted-env-files
        name: Check env files are SOPS encrypted
        entry: bash .githooks/check-staged-env
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: encrypted-env-push
        name: Check pushed env files are SOPS encrypted
        entry: bash .githooks/check-pushed-env
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
